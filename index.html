<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFK F2 - Nächste Abfahrten</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="route-name">SFK F2</h1>
        </header>

        <div class="current-time">
            <div class="time-display">
                <span id="current-time">--:--</span>
                <span class="time-label">Aktuelle Zeit</span>
            </div>
        </div>

        <div class="route-container" id="route-container">
            <!-- Stations will be generated here by JavaScript -->
        </div>

        <div class="schedule-info">
            <h3>Fahrplan-Info</h3>
            <div class="schedule-details" id="schedule-details">
                <!-- Schedule info will be generated here by JavaScript -->
            </div>
        </div>

        <footer>
            <p id="footer-text">SFK F2 - Fahrplan-Website</p>
        </footer>
    </div>
    <script src="script.js"></script>
    <script src="route-generator.js"></script>
    <script src="sfk-f2-route.js"></script>
    <script src="kiel-laboe-route.js"></script>
    <script src="laboe-kiel-route.js"></script>
    <script src="routes-manager.js"></script>
    <script>
        // Initialize routes manager when page loads
        document.addEventListener('DOMContentLoaded', function() {
            window.routesManager = new RoutesManager();
            window.routesManager.init();
        });
    </script>
</body>
</html>
